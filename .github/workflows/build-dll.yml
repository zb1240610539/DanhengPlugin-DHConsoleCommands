name: Build Plugin DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发执行

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 环境以确保与 .NET 类库编译完全兼容[cite: 6]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x # 匹配项目所需的 .NET 版本[cite: 6]

    - name: Restore Dependencies
      run: dotnet restore DanhengPlugin-DHConsoleCommands.csproj

    - name: Build Solution
      run: dotnet build DanhengPlugin-DHConsoleCommands.csproj --configuration Release --no-restore

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DanhengPlugin-DLL
        path: |
          bin/Release/net8.0/DanhengPlugin.DHConsoleCommands.dll
          bin/Release/net8.0/*.pdb
