name: Build Plugin DLL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore DanhengPlugin-DHConsoleCommands.csproj

    - name: Build Solution
      run: dotnet build DanhengPlugin-DHConsoleCommands.csproj --configuration Release --no-restore --output ./artifacts

    - name: List build output
      run: dir ./artifacts

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DanhengPlugin-DLL
        path: |
          artifacts/DanhengPlugin.DHConsoleCommands.dll
          artifacts/*.pdb
